services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      - DATABASE_URL=sqlite:////data/baby_names.db
    volumes:
      - ${DATA_DIR:-./.data}:/data
    ports:
      - "${API_PORT:-8000}:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${FRONTEND_PORT:-8060}:80"
    depends_on:
      - api
    restart: unless-stopped

  ingestion:
    build:
      context: .
      dockerfile: ingestion/Dockerfile
    profiles: ["tools"]
    env_file: .env
    environment:
      - DATABASE_URL=sqlite:////data/baby_names.db
    volumes:
      - ${DATA_DIR:-./.data}:/data
